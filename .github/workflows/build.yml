name: Build

on:
  push:
    branches: [main]
    tags: ['*.*.*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installers:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            arch: x64
          - name: windows-arm64
            os: windows-latest
            arch: arm64
          - name: linux-x64
            os: ubuntu-24.04
            arch: x64
          - name: linux-arm64
            os: ubuntu-24.04
            arch: arm64
          - name: macos-arm64
            os: macos-latest
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fakeroot rpm

      - run: pnpm install --frozen-lockfile

      - name: Stamp the version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Tag '$version' is not a version the packagers accept; use 1.2.3"
              exit 1
            fi
            node -e 'const p = require("./package.json");
              p.version = process.argv[1];
              require("node:fs").writeFileSync("package.json", JSON.stringify(p, null, "\t") + "\n");' "$version"
            echo "LABEL=$version" >> "$GITHUB_ENV"
          else
            # Not a release: the package keeps 0.0.0, and only the file name carries the
            # commit, so untagged artifacts are still traceable.
            echo "LABEL=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
          node -p "'packaging as ' + require('./package.json').version"

      - name: Make installers
        run: pnpm exec electron-forge make --arch=${{ matrix.arch }}

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find out/make -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' -o -name '*.zip' \) \
            -print0 |
            while IFS= read -r -d '' file; do
              cp "$file" "dist/comparer-${LABEL}-${{ matrix.name }}.${file##*.}"
            done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: comparer-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: installers
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: comparer-*
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
